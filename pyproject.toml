[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloth-mode"
version = "0.1.0"
description = "Open-weight AI (Gemma) that does your chores while you nap. Local by default, zero dependencies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "gemma",
    "huggingface",
    "ollama",
    "local-llm",
    "open-weights",
    "agents",
    "automation",
    "offline",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
# Deliberately empty: the standard library can do all of this, and
# `pip install` should not be a chore either.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
sloth = "sloth.cli:main"

[project.urls]
Homepage = "https://github.com/Pager-dot/sloth-mode"
Issues = "https://github.com/Pager-dot/sloth-mode/issues"

[tool.hatch.build.targets.wheel]
packages = ["sloth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

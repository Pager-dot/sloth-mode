name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      # No model server is started anywhere in CI; the suite fakes one.
      - name: Test
        run: python -m pytest -q

      - name: Smoke test the CLI with no model at all
        shell: bash
        run: |
          python -m sloth --version
          python -m sloth --no-model doctor
          python -m sloth --no-model tidy examples/messy-downloads --json
          python -m sloth --no-model brief examples/chats --markdown

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
